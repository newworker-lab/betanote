name: Build and attach desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build tools
        run: npm ci --ignore-scripts
      - name: Test storage
        run: npm test
      - name: Check third-party notices
        run: npm run notices -- --check
      - name: Build Linux and Windows portable apps
        run: |
          npm run package
          npm run package:win
      - name: Test packaged Linux app
        run: npm run test:desktop
      - name: Archive packages and checksums
        env:
          APP_RELEASE_VERIFICATION: 'Linux packaged app tested (npm run test:desktop); Debian package installed, reinstalled and removed on ubuntu-24.04; Windows packaged, runtime not tested'
        run: python3 scripts/archive.py
      # The Debian package as a person meets it: installed with its dependencies, installed again over itself (the
      # user's own settings stay), and removed without leaving its entry in the applications list.
      - name: Install, reinstall and remove the Debian package
        run: |
          set -e
          id="$(node -p "require('./core/app-name.json').id")"
          deb="$(ls release/${id}_*_amd64.deb)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils "./$deb"
          desktop-file-validate "/usr/share/applications/$id.desktop"
          test -u "/opt/$id/chrome-sandbox"
          test -x "/usr/bin/$id"
          test -f "/usr/share/icons/hicolor/256x256/apps/$id.png"
          mkdir -p "$HOME/.config/keep-me"
          sudo apt-get install -y -qq --reinstall "./$deb"
          test -d "$HOME/.config/keep-me"
          sudo apt-get remove -y -qq "$id"
          test ! -e "/usr/share/applications/$id.desktop"
          test ! -e "/opt/$id/$id"
          test ! -e "/usr/bin/$id"
          test ! -e "/usr/share/icons/hicolor/256x256/apps/$id.png"
      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./core/app-name.json').name")"
          id="$(node -p "require('./core/app-name.json').id")"
          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag and package version do not match" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "${name} ${version}" --notes-file release/RELEASE-NOTES.md
          fi
          gh release upload "$tag" "release/${id}-${version}-windows-x64.zip" "release/${id}-${version}-linux-x64.tar.gz" "release/${id}_${version}_amd64.deb" release/SHA256SUMS.txt --clobber

  # macOS (beta): the apps for Apple silicon and Intel, signed ad hoc (no Apple Developer ID, not notarised), checked on
  # the Mac that builds them and attached to the release the job above made. A failure here leaves the release as it
  # is, without the macOS files.
  mac:
    needs: release
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build tools
        run: npm ci --ignore-scripts
      - name: Make the app icon
        run: |
          set -euo pipefail
          id=$(node -p "require('./core/app-name.json').id")
          set="$RUNNER_TEMP/icon.iconset"; mkdir "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s brand/png/$id-icon-1024.png --out "$set/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) brand/png/$id-icon-1024.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o brand/$id.icns
      - name: Build and sign the apps
        run: |
          set -euo pipefail
          id=$(node -p "require('./core/app-name.json').id")
          npm run build
          for a in arm64 x64; do
            node scripts/package.mjs darwin $a
            codesign --force --deep --sign - "release/$id-darwin-$a/$id.app"
            codesign --verify --deep --strict "release/$id-darwin-$a/$id.app"
          done
      # The stores refuse a folder reached through a link, and macOS keeps temporary files under /var, a link.
      - name: Test the packaged app
        run: |
          export TMPDIR=$(cd "${TMPDIR:-/tmp}" && pwd -P)
          perl -e 'alarm shift; exec @ARGV' 600 npm run test:desktop
      - name: Zip and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(node -p "require('./core/app-name.json').id"); v=$(node -p "require('./package.json').version")
          mkdir out
          for a in arm64 x64; do ditto -c -k --sequesterRsrc --keepParent "release/$id-darwin-$a/$id.app" "out/$id-$v-macos-$a.zip"; done
          (cd out && shasum -a 256 *.zip > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt)
          gh release upload "v$v" out/*.zip out/SHA256SUMS-macos.txt --clobber
